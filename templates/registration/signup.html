{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
    <h1>Sign up</h1>
    <div class="card auth-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-block">Sign up</button>
        </form>
        <p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
    </div>
{% endblock %}
