{% extends "base.html" %}
{% block title %}Delete project{% endblock %}
{% block content %}
    <h1>Delete "{{ project.name }}"?</h1>
    <div class="card card-danger">
        <p>This will also delete all of its tasks. This can't be undone.</p>
        <form method="post" class="actions">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete it</button>
            <a href="{% url 'todos:project-detail' project.pk %}" class="btn btn-ghost">Cancel</a>
        </form>
    </div>
{% endblock %}
