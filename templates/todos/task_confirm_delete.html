{% extends "base.html" %}
{% block title %}Delete task{% endblock %}
{% block content %}
    <h1>Delete "{{ task.title }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete it</button>
        <a href="{% url 'todos:project-detail' task.project.pk %}">Cancel</a>
    </form>
{% endblock %}
