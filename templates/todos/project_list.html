{% extends "base.html" %}
{% block title %}Projects{% endblock %}
{% block content %}
    <h1>Projects</h1>
    <ul>
        {% for project in projects %}
            <li><a href="{% url 'todos:project-detail' project.pk %}">{{ project.name }}</a></li>
        {% empty %}
            <li>No projects yet.</li>
        {% endfor %}
    </ul>
    <p><a href="{% url 'todos:project-create' %}">+ New project</a></p>
{% endblock %}
