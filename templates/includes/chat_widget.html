{% load static %}
<!-- Floating Chat Widget -->
<div id="chat-widget">
  <button id="chat-toggle-btn" aria-label="Open help chat">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
  </button>

  <div id="chat-window" class="hidden">
    <div id="chat-header">
      <span>TaskFlow Help</span>
      <button id="chat-close-btn" aria-label="Close chat">&times;</button>
    </div>
    <div id="chat-messages"></div>
    <form id="chat-input-form">
      <input type="text" id="chat-input" placeholder="Ask a question..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
</div>

<link rel="stylesheet" href="{% static 'css/chat_widget.css' %}">
<script src="{% static 'js/chat_widget.js' %}"></script>
